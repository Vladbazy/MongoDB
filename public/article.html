<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Статья</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    .meta { color: #555; font-size: 0.9rem; margin-bottom: 1rem; }
    .review { background: #f3f4f6; padding: 0.8rem; margin: 0.5rem 0; border-radius: 6px; }
    .rating { color: #d97706; font-weight: bold; }
    a { text-decoration: none; color: #2563eb; }
  </style>
</head>
<body>
  <a href="index.html">← Назад к списку</a>
  <h1 id="title"></h1>
  <div class="meta" id="meta"></div>
  <div id="tags" style="margin: 0.5rem 0; font-style: italic; color: #666;"></div>
  <hr>
  <div id="content"></div>
  <h3> Рецензии:</h3>
  <div id="reviews"></div>
  <script src="article.js"></script>
</body>
<!-- Форма добавления рецензии -->
<h3> Оставить рецензию:</h3>
<form id="review-form" style="background:#f9fafb; padding:1rem; border-radius:6px; margin-top:1rem; border:1px solid #e5e7eb;">
  <div style="margin-bottom:0.5rem;">
    <input type="text" id="rev-name" placeholder="Ваше имя" required style="width:100%; padding:0.5rem; box-sizing:border-box;">
  </div>
  <div style="margin-bottom:0.5rem;">
    <textarea id="rev-message" placeholder="Текст рецензии" required style="width:100%; padding:0.5rem; height:80px; resize:vertical; box-sizing:border-box;"></textarea>
  </div>
  <div style="margin-bottom:0.8rem;">
    <label style="font-size:0.9rem; color:#555;">Оценка (1-10):</label>
    <input type="number" id="rev-rating" min="1" max="10" required style="padding:0.5rem; width:80px;">
  </div>
  <button type="submit" style="background:#2563eb; color:white; padding:0.5rem 1rem; border:none; border-radius:4px; cursor:pointer;">Отправить</button>
</form>
</html>
