<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Научный журнал</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    .row { display: flex; gap: 0.5rem; margin: 0.5rem 0; flex-wrap: wrap; }
    input, select, button { padding: 0.5rem; font-size: 1rem; }
    button { background: #2563eb; color: #fff; border: none; cursor: pointer; border-radius: 4px; }
    button:hover { background: #1d4ed8; }
    ul { list-style: none; padding: 0; }
    li { background: #f8fafc; margin: 0.3rem 0; padding: 0.6rem; border-left: 4px solid #2563eb; }
  </style>
</head>
<body>
  <h1>📚 Электронный научный журнал</h1>
  
  <div class="row">
    <button id="btn-list">Список статей</button>
  </div>
  
  <div class="row">
    <input type="text" id="title-input" placeholder="Введите название...">
    <button id="btn-title">Поиск по названию</button>
  </div>
  
  <div class="row">
    <select id="author-select"><option value="">Выберите автора</option></select>
    <button id="btn-author">Поиск по автору</button>
  </div>

  <hr>
  <h3>Результаты:</h3>
  <div id="results"></div>

  <script src="script.js"></script>
</body>
</html>
